; C&C World-Altering Editor (WAE)
; https://github.com/CnCNet/WorldAlteringEditor

; This file defines the trigger event conditions available in the map editor.
; The sections are parsed in their order and the events are
; assigned internal indexes based on their order in this file.

; Each event has a name, a description, and parameter types.
; A parameter needs a type specified for it to show up in the editor.
; Currently available parameter types (go bash Rampa if you need something added):
; Unused,
; Unknown,
; Number,
; LocalVariable,
; TeamType,
; Techno,
; Building,
; Aircraft,
; Infantry,
; Unit,
; Movie,
; Text,
; Trigger,
; Boolean,
; Sound,
; Theme,
; Speech,
; SuperWeapon,
; Animation,
; Particle,
; Waypoint,
; String,
; GlobalVariable,
; House


[NoEvent]
Name=无事件
Description=这是一个空事件.在实际触发器中不需要使用这个.

[EnteredBy]
Name=进入者
Description=当给定阵营的任何步兵或车辆进入附属建筑或单元格时触发.可以使用-1表示'任意阵营'.
P2Type=HouseType

[SpiedUpon]
Name=被监视
Description=当间谍进入附属建筑时触发.

[ThievedBy]
Name=被盗取
Description=当盗贼从指定阵营偷取金钱时触发.
Available=no ; 盗贼不起作用
P2Type=HouseType

[DiscoveredByPlayer]
Name=被玩家发现
Description=当附属对象被玩家发现时触发.发现意味着从迷雾下揭示.不要在多人游戏地图中使用, 因为迷雾在不同玩家之间不同步.

[HouseDiscovered]
Name=阵营被发现
Description=当指定阵营的任何单位或建筑被玩家发现时触发.发现意味着从迷雾下揭示.不要在多人游戏地图中使用, 因为迷雾在不同玩家之间不同步.
P2Type=HouseType

[AttackedByAnyHouse]
Name=被任意阵营攻击
Description=当附属对象以某种方式受到攻击时触发.附带伤害或友军误击不算在内.

[DestroyedByAnyHouse]
Name=被任意阵营摧毁
Description=当附属对象被摧毁时触发.由附带伤害或友军误击导致的摧毁不算在内.大多数情况下建议使用48号事件'被任何方式摧毁'代替.

[AnyEvent]
Name=任意事件
Description=单独使用时, 会立即触发触发器.注意：已知在地图开始时与其他事件同时发生会有覆盖或冲突的错误.

[AllUnitsDestroyed]
Name=所有单位被摧毁
Description=当指定阵营的所有单位被摧毁时触发.通常用于游戏结束条件.不包括平民单位.
P2Type=HouseType

[AllBuildingsDestroyed]
Name=所有建筑被摧毁
Description=当指定阵营的所有建筑被摧毁时触发.通常用于游戏结束条件.
P2Type=HouseType

[AllDestroyed]
Name=所有对象被摧毁
Description=当指定阵营拥有的所有对象被摧毁时触发.通常用于游戏结束条件.
P2Type=HouseType

[CreditsExceed]
Name=资金超过
Description=当所属阵营的资金总额超过指定金额时触发.
P2Type=Number

[ElapsedTime]
Name=经过时间
Description=当经过的时间 (以秒为单位, 在15 FPS下) 到期时触发.此时间在触发器创建时初始化.如果触发器设置为重复, 则每次触发时计时器都会重置.
P2Type=Number

[TimerExpired]
Name=计时器到期
Description=当全局任务计时器 (如屏幕上显示的) 达到零时触发.

[DestroyedBuildings]
Name=建筑物被摧毁, #
Description=当属于触发器指定阵营的建筑物数量被摧毁时触发.
P2Type=Number

[DestroyedUnits]
Name=单位被摧毁, #
Description=当属于触发器指定阵营的单位数量被摧毁时触发.
P2Type=Number

[NoFactoriesLeft]
Name=没有工厂剩余
Description=当触发器中指定的阵营没有任何工厂剩余时触发.

[CiviliansEvacuated]
Name=平民撤离
Description=当平民撤离 (离开地图) 时触发.

[BuiltBuildingType]
Name=建造建筑类型
Description=当触发器所属阵营建造指定类型的建筑时, 此事件将触发.
P2Type=Building

[BuiltUnitType]
Name=建造单位类型
Description=当触发器所属阵营建造指定类型的单位时, 此事件将触发.
P2Type=Unit

[BuiltInfantryType]
Name=建造步兵类型
Description=当触发器所属阵营建造指定类型的步兵时, 此事件将触发.
P2Type=Infantry

[BuiltAircraftType]
Name=建造飞机类型
Description=当触发器所属阵营建造指定类型的飞机时, 此事件将触发.
P2Type=Aircraft

[TeamLeavesMap]
Name=队伍离开地图
Description=当指定队伍离开地图时触发.如果队伍被摧毁, 则不会触发.如果除一名成员外的所有成员都被摧毁且最后一名成员离开了地图, 则会触发.
P1Type=-1
P2Type=TeamType

[ZoneEntryBy]
Name=区域进入者
Description=当特定阵营的单位进入与该触发器关联的CellTag区域时触发.
P2Type=HouseType

[CrossesHorizontalLine]
Name=穿过水平线
Description=当特定阵营的单位穿过由触发器位置指示的水平线时触发.此触发器必须放置在一个单元格中.
P2Type=HouseType

[CrossesVerticalLine]
Name=穿过垂直线
Description=当特定阵营的单位穿过由触发器位置指示的垂直线时触发.此触发器必须放置在一个单元格中.
P2Type=HouseType

[GlobalIsSet]
Name=全局变量已设置
Description=当指定的全局变量 (在rules.ini中命名) 开启时触发.注意, 当此事件触发时, 它会重置该触发器上的其他事件 (如果有) .这导致无论顺序如何, 总是先检查此事件！
P2Type=GlobalVariable

[GlobalIsClear]
Name=全局变量已清除
Description=当指定的全局变量 (在rules.ini中命名) 关闭时触发.注意, 当此事件触发时, 它会重置该触发器上的其他事件 (如果有) .这导致无论顺序如何, 总是先检查此事件！
P2Type=GlobalVariable

[DestroyedByAnythingNotInfiltrate]
Name=被任何方式摧毁 (非渗透)
Description=当附属对象被摧毁但不是通过渗透建筑/单位时触发.

[LowPower]
Name=电力不足
Description=当指定阵营的电力低于100%时触发.
P2Type=HouseType

[BridgeDestroyed]
Name=桥梁被摧毁
Description=当连接的桥梁被摧毁时触发.一个桥梁被视为摧毁, 当其创建了一个不可通过的缺口.

[BuildingExists]
Name=建筑物存在
Description=当指定的建筑 (属于此触发器所属阵营) 存在于地图上时触发.考虑的是预先放置的、部署的或从侧边栏下单的建筑.
P2Type=Building

[SelectedByPlayer]
Name=选中单位
Description=当单位被玩家选中时触发.仅在单人游戏中使用.

[ComesNearWaypointZZ]
Name=接近路点
Description=当物体接近指定路点时触发.
P2Type=WaypointZZ

;35
[EnemyInSpotlight]
Name=敌人在聚光灯下
Description=当敌方单位进入附属建筑投射的聚光灯范围时触发.附属标签必须设置为重复.参见事件54.

[LocalIsSet]
Name=本地变量已设置
Description=当指定的本地变量开启时触发.注意, 当此事件触发时, 它会重置该触发器上的其他事件 (如果有) .这导致无论顺序如何, 总是先检查此事件！
P2Type=LocalVariable

[LocalIsClear]
Name=本地变量已清除
Description=当指定的全局变量 (在rules.ini中命名) 关闭时触发.注意, 当此事件触发时, 它会重置该触发器上的其他事件 (如果有) .这导致无论顺序如何, 总是先检查此事件！
P2Type=LocalVariable

[FirstDamagedCombat]
Name=首次受到战斗伤害
Description=当首次遭受来自战斗的伤害时触发.

[HalfHealthCombat]
Name=半血 (仅限战斗)
Description=当由于战斗伤害而降至一半生命值时触发.

[QuarterHealthCombat]
Name=四分之一血 (仅限战斗)
Description=当由于战斗伤害而降至四分之一生命值时触发.

[FirstDamagedAnySource]
Name=首次受到任何来源的伤害
Description=当首次遭受任何来源的战斗伤害时触发.

[HalfHealthAnySource]
Name=半血 (任何来源)
Description=当因任何来源的伤害降至一半生命值时触发.

[QuarterHealthAnySouce]
Name=四分之一血 (任何来源)
Description=当因任何来源的伤害降至四分之一生命值时触发.

[AttackedBy]
Name=被攻击
Description=当被特定阵营的单位攻击时触发.
P2Type=HouseType

[AmbientLightBelow]
Name=环境光低于
Description=当地图上的环境光照度下降到特定水平以下时触发.使用0到100之间的数值.
P2Type=Number

[AmbientLightAbove]
Name=环境光高于
Description=当地图上的环境光照度上升到特定水平以上时触发.使用0到100之间的数值.
P2Type=Number

[ElapsedScenarioTime]
Name=经过的时间
Description=自从场景开始以来经过指定秒数时触发.
P2Type=Number

[DestroyedByAnything]
Name=被任何方式摧毁
Description=当被摧毁、捕获或渗透时触发, 不论原因.

[PickedUpCrate]
Name=拾取补给箱
Description=当附属对象拾起补给箱时触发.

[PickedUpCrateAny]
Name=任意单位拾取补给箱
Description=当任何单位拾起补给箱时触发.

[RandomDelay]
Name=随机延迟
Description=延迟一个介于指定时间 (帧) 50%到150%之间的随机时间.
P2Type=Number

[CreditsBelow]
Name=资金低于
Description=当所属阵营的资金总额低于指定金额时触发.
P2Type=Number

[SpyEntersAsHouse]
Name=伪装成特定阵营的间谍进入
Description=当伪装成特定阵营的间谍进入此区域时触发.
P2Type=HouseType

[SpyEntersAsInfantry]
Name=伪装成特定步兵的间谍进入
Description=当伪装成特定步兵类型的间谍进入附属对象时触发.
P2Type=Infantry

[DestroyedUnitsNaval]
Name=所有海军单位被摧毁
Description=当特定阵营的所有海军单位被摧毁时触发.
P2Type=HouseType

[DestroyedUnitsLand]
Name=所有陆军单位被摧毁
Description=当特定阵营的所有陆军单位被摧毁时触发.
P2Type=HouseType

[BuildingDoesNotExist]
Name=建筑物不存在
Description=当没有特定类型 (属于此触发器所属阵营) 的建筑物存在于地图上时触发.
P2Type=Building

[PowerFull]
Name=电力充足
Description=当所属阵营的电力达到100%时触发.
P2Type=HouseType

[EnteredOrOverflownBy]
Name=进入或飞越
Description=当特定阵营拥有的物体移动过附属单元格时触发.
P2Type=HouseType

[TechnoTypeExists]
Name=技术类型存在
Description=当至少有一定数量的特定技术类型存在于地图上时触发.
P1Type=-2
P2Type=Number
P3Type=Techno

[TechnoTypeDoesNotExist]
Name=技术类型不存在
Description=当特定技术类型不存在于地图上时触发.
P1Type=-2
P3Type=Techno

; ********** ARES BEGINS ***********

[EMPulse1]
Name=电磁脉冲影响中 [Ares]
Description=当附属对象被电磁脉冲禁用时触发.

[EMPulse2]
Name=由特定阵营的电磁脉冲影响 [Ares]
Description=当特定阵营使用电磁脉冲禁用附属对象时触发.在62号事件之前触发.
P2Type=HouseType

[EMPulse3]
Name=移除电磁脉冲影响 [Ares]
Description=当附属对象通过'修复'电磁脉冲重新激活时触发.

[EMPulse4]
Name=由特定阵营移除电磁脉冲影响 [Ares]
Description=当特定阵营通过'修复'电磁脉冲重新激活附属对象时触发.在64号事件之前触发.
P2Type=HouseType

[FoundInSpotlight]
Name=敌人现在在聚光灯下 [Ares]
Description=当附属建筑的搜索聚光灯发现敌人时触发.类似于35号事件, 但游戏不会记住此事件是否发生过.

[DriverKilled]
Name=驾驶员被击杀 [Ares]
Description=当附属对象的驾驶员被击杀时触发.

[DriverKilledHouse]
Name=由特定阵营击杀驾驶员 [Ares]
Description=当特定阵营击杀附属对象的驾驶员时触发.在67号事件之前触发.
P2Type=HouseType

[VehicleTaken]
Name=车辆被夺取 [Ares]
Description=当驾驶员或车辆窃贼进入附属对象时触发.

[VehicleTakenHouse]
Name=由特定阵营夺取车辆 [Ares]
Description=当特定阵营的驾驶员或车辆窃贼进入附属对象时触发.在69号事件之前触发.
P2Type=HouseType

[Abducted]
Name=被绑架 [Ares]
Description=当附属对象被绑架时触发.

[AbductedHouse]
Name=由特定阵营绑架 [Ares]
Description=当特定阵营绑架附属对象时触发.
P2Type=HouseType

[DoesTheAbducting]
Name=进行绑架 [Ares]
Description=当附属对象绑架某物时触发.

[DoesTheAbductingHouse]
Name=绑架特定阵营的单位 [Ares]
Description=当附属对象绑架特定阵营的单位时触发.
P2Type=HouseType

[SWActivated]
Name=超级武器激活 [Ares]
Description=当所属阵营启动超级武器时触发.
P2Type=SuperWeapon

[SWDeactivated]
Name=超级武器停用 [Ares]
Description=当所属阵营停用超级武器时触发.仅限于充电-耗尽类型的超级武器.
P2Type=SuperWeapon

[SWNearWP]
Name=靠近路点的超级武器激活 [Ares]
Description=当指定超级武器在接近路点时被使用时触发.
P1Type=-2
P2Type=WaypointZZ
P3Type=SuperWeapon

[ReverseEngineered]
Name=逆向工程 [Ares]
Description=当所属阵营拥有对逆向工程技术类型的访问权限时触发.该事件会在单位作为逆向工程技术类型放入逆向工程结构时触发, 即遵循逆向为条件.
P2Type=Techno

[ReverseEngineers]
Name=任何类型的逆向工程 [Ares]
Description=当附属建筑成功逆向工程任意类型时触发.

[ReverseEngineersType]
Name=特定类型的逆向工程 [Ares]
Description=当附属建筑成功逆向工程特定类型时触发.
P2Type=Techno

[HouseOwnsTechno]
Name=阵营拥有技术类型 [Ares]
Description=当所属阵营至少拥有指定数量的技术类型实例时触发.
P1Type=-2
P2Type=Number
P3Type=Techno

[HouseDoesntOwnTechno]
Name=阵营不拥有技术类型 [Ares]
Description=当所属阵营拥有的指定技术类型实例少于指定数量时触发.
P1Type=-2
P2Type=Number
P3Type=Techno

[AttackedByAnything]
Name=被任何人攻击或摧毁 [Ares]
Description=当附属对象被任何攻击 (即使没有来源) 攻击或摧毁时触发.

[AttackedByAnythingHouse]
Name=被特定阵营攻击或摧毁 [Ares]
Description=当附属对象被属于特定阵营的来源攻击或摧毁时触发.
P2Type=HouseType

[DestroyedByHouse]
Name=被特定阵营摧毁 [Ares]
Description=当附属对象被属于特定阵营的来源攻击而摧毁时触发.
P2Type=HouseType

[DoesntExistMoreThan]
Name=技术类型不存在超过 [Ares]
Description=当特定技术类型的实例不超过指定数量时触发.
P1Type=-2
P2Type=Number
P3Type=Techno

[KeepALivesDestroyed]
Name=所有存活保持单位被摧毁 [Ares]
Description=当特定阵营没有更多带有存活保持=yes的对象时触发.
P2Type=HouseType

[KeepALivesDestroyed2]
Name=所有存活保持建筑被摧毁 [Ares]
Description=当特定阵营没有更多带有存活保持=yes的建筑时触发.
P2Type=HouseType

; ********** ARES ENDS ***********
