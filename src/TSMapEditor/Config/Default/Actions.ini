; C&C World-Altering Editor (WAE)
; https://github.com/CnCNet/WorldAlteringEditor

; This file defines the trigger actions available in the map editor.
; The sections are parsed in their order and the actions are
; assigned internal indexes based on their order in this file.

; Each action has a name, a description, and parameter types.
; A parameter needs a type specified for it to show up in the editor.
; Currently available parameter types (go bash Rampa if you need something added):
; Unused,
; Unknown,
; Number (9),
; LocalVariable,
; TeamType (7),
; Building,
; Aircraft,
; Infantry,
; Unit,
; Movie (12),
; Text (13),
; Trigger (14),
; Boolean (37),
; Sound (16),
; Theme (17),
; Speech (18),
; SuperWeapon (36),
; Animation (25),
; Particle (26),
; VoxelAnim (30),
; Waypoint (1),
; WaypointZZ,
; String,
; GlobalVariable (35),
; HouseType (2),
; StringTableEntry

; A trigger action can have up to 7 parameters. When defining types for these, they range from P1Type= to P7Type=.
; If a trigger action takes a waypoint, typically the waypoint is P7 (this is why FinalSun has "uses waypoint" instead of P7 type).

[NoAction]
Name=无操作
Description=这是一个空操作.它不会执行任何操作, 等同于完全没有操作.

[WinnerIs]
Name=胜利者是
Description=将强制指定阵营成为胜利者.游戏会立即结束.通常指定玩家的阵营.
P2Type=HouseType

[LoserIs]
Name=失败者是
Description=将强制指定阵营成为失败者.游戏会立即结束.通常指定玩家的阵营.
P2Type=HouseType

[ProductionBegins]
Name=生产开始
Description=指定阵营 (计算机) 将开始单位和建筑的生产.
P2Type=HouseType

[CreateTeam]
Name=创建队伍
Description=创建指定类型的队伍.如果可能的话招募队伍成员, 否则使拥有该队伍类型的阵营从工厂建造单位.
P1Type=-1
P2Type=TeamType

[DestroyTeam]
Name=摧毁队伍
Description=摧毁所有指定类型的队伍实例.那些现有队伍中的单位将继续存在并可用于招募到其他队伍中.
P1Type=-1
P2Type=TeamType

[AllToHunt]
Name=全部猎杀
Description=强制指定阵营的所有单位进入'猎杀'模式.他们将寻找并摧毁敌人.
P2Type=HouseType

[Reinforcement]
Name=增援
Description=创建指定队伍的增援.该队伍的成员将会通过此操作神奇地创建出来.
P1Type=-1
P2Type=TeamType

[DropZoneFlare]
Name=投放区信号弹
Description=在指定路点显示一个投放区信号弹.地图上该位置周围的区域也将被揭示.
P7Type=WaypointZZ

[FireSale]
Name=清仓大甩卖
Description=导致指定阵营的所有建筑被出售 (换取现金和其他奖品) .通常这被用于计算机的最后一波攻击.
P2Type=HouseType

[PlayMovie]
Name=播放电影
Description=全屏显示指定的电影.在此期间游戏暂停, 并在电影结束后恢复正常.
P2Type=Movie

[TextTrigger]
Name=文本触发器
Description=显示字符串表中的字符串.
P1Type=-4
P2Type=StringTableEntry

[DestroyTrigger]
Name=摧毁触发器
Description=摧毁所有当前指定类型的触发器实例.这不会阻止未来创建该触发器的新实例.
P1Type=-2
P2Type=Trigger

[AutocreateBegins]
Name=自动创建开始
Description=为指定阵营启动自动创建.这将导致计算机的阵营根据需要构建自动创建的队伍.
P2Type=HouseType

[ChangeHouse]
Name=更改阵营
Description=将附属对象的拥有阵营更改为指定的阵营.
P2Type=HouseType

[AllowWin]
Name=允许获胜
Description=在泰伯利亚之日和尤里的复仇中不起作用.在红色警报1中, 移除一个阻止玩家获胜的'障碍'.障碍数量等于创建了此操作的触发器的数量.

[RevealAllMap]
Name=揭示全图
Description=向所有玩家揭示整个地图.

[RevealAroundWaypointZZ]
Name=揭示路点周围区域
Description=向玩家揭示指定路点周围的地图区域.
P2Type=WaypointZZ

[RevealZoneOfWaypointZZ]
Name=揭示路点所在区域
Description=揭示与指定路点相同区域的所有单元格.这可能会产生一些奇怪的结果, 请谨慎使用.
P2Type=WaypointZZ

[PlaySound]
Name=播放声音
Description=播放指定的声音效果.使用Sounds.ini中的编号.
P1Type=-7
P2Type=Sound

[PlayMusicTheme]
Name=播放音乐主题
Description=播放指定的音乐曲目.曲目列在Theme.ini中.
P1Type=-8
P2Type=Theme

[PlaySpeech]
Name=播放语音
Description=播放指定的语音.
P1Type=-6
P2Type=Speech

[ForceTrigger]
Name=强制触发器
Description=无论其事件标志如何指示, 强制所有指定类型的触发器触发.
P1Type=-2
P2Type=Trigger

[TimerStart]
Name=计时器开始
Description=启动全局任务计时器.

[TimerStop]
Name=计时器停止
Description=停止全局任务计时器.

[TimerExtend]
Name=计时器延长
Description=将全局任务计时器按指定时间 (以秒为单位, 在15 FPS下) 延长.
P2Type=Number

[TimerShorten]
Name=计时器缩短
Description=将全局任务计时器按指定时间 (以秒为单位, 在15 FPS下) 缩短.它永远不会减少到'零'时间以下.
P2Type=Number

[TimerSet]
Name=计时器设置
Description=将全局任务计时器设置为指定值 (以秒为单位, 在15 FPS下) .
P2Type=Number

[GlobalSet]
Name=全局变量设置
Description=设置全局标记.全局变量在rules.ini文件中命名.全局标记可以是'开启/设置/真'或'关闭/清除/假'.
P2Type=GlobalVariable

[GlobalClear]
Name=全局变量清除
Description=清除全局标记.全局变量在rules.ini文件中命名.全局标记可以是'开启/设置/真'或'关闭/清除/假'.
P2Type=GlobalVariable

[AutoBaseBuilding]
Name=自动基地建设
Description=初始化计算机对战模式下的建筑控制为'开启'或'关闭'状态.当'开启'时, 计算机接管, 就像处于对战模式一样. (确保他有一个指挥中心)
P2Type=Boolean

[GrowShroudOneStep]
Name=增长迷雾一步
Description=增加迷雾的暗度一步 (单元格) .

[DestroyAttachedObject]
Name=摧毁附属对象
Description=摧毁此触发器所附属的任何建筑\桥梁或单位.

[Add1TimeSpecialWeapon]
Name=添加一次性特殊武器
Description=为触发器所属阵营添加一次性的特殊武器 (如所示) .
P2Type=SuperWeapon

[AddRepeatingSpecialWeapon]
Name=添加重复使用的特殊武器
Description=为触发器所属阵营添加永久性的特殊武器 (如所示) .
P2Type=SuperWeapon

[PreferredTarget]
Name=优先目标
Description=指定触发器所属阵营在使用特殊武器攻击时应使用什么作为其优先目标.
P2Type=Quarry

[AllChangeHouse]
Name=全部更改阵营
Description=将触发器拥有者阵营的所有对象更改为指定阵营.
P2Type=HouseType

[MakeAlly]
Name=建立同盟
Description=使此触发器所属阵营与指定阵营结盟, 且指定阵营也与此触发器所属阵营结盟 (双向同盟) .
