Description=在指定路点创建雷达事件.0 = 红色 - 如果雷达上已有一个则不会生成, 1 = 绿色, 2 = 绿色, 3 = 红色, 4 = 同0, 5 = 黄色 - 如果雷达上已有一个则不会生成, 6 = 黄色 - 永远显示在雷达上.
