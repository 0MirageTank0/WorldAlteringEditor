[MakeEnemy]
Name=建立敌对
Description=使此触发器所属阵营与指定阵营解除同盟 (宣战) .
P2Type=HouseType

[ChangeZoomLevel]
Name=更改缩放级别
Description=更改玩家雷达地图的缩放级别.使用1表示正常视图, 2表示缩小视图.
P2Type=Number

[ResizePlayerView]
Name=调整玩家视图大小
Description=更改地图中玩家的视图矩形区域.输入格式为：x, y, w, h, 其中x, y给出左上角坐标, w, h给出宽度和高度.
P3Type=Number
P3Name=左边距
P4Type=Number
P4Name=顶边距
P5Type=Number
P5Name=宽度
P6Type=Number
P6Name=高度

[PlayAnimAt]
Name=播放动画于
Description=在指定单元格播放指定动画.使用rules.ini中的[Animations]部分的索引.
P2Type=Animation
P7Type=WaypointZZ

[DoExplosionAt]
Name=执行爆炸于
Description=在指定路点使用指定武器的弹头创建爆炸.使用游戏内部WeaponTypes列表的0基索引.提供的列表仅包括rules.ini中的[Weapons]部分中的项目.
