[ChangeSpotlightBehavior]
Name=更改探照灯行为
Description=更改建筑物探照灯的行为方式.将此触发器附加到投射探照灯的建筑物.0=无探照灯, 1=规则设置 (受方向影响) , 2=圆形, 3=跟随探照灯内的单位.
P2Type=SpotlightBehaviour

[EnableTrigger]
Name=启用触发器
Description=启用目标触发器.
P1Type=-2
