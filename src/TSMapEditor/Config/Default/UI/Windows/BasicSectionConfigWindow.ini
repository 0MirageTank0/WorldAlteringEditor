[BasicSectionConfigWindow]
$Width=EMPTY_SPACE_SIDES + 300 + EMPTY_SPACE_SIDES + 300 + EMPTY_SPACE_SIDES
$CCHeader=lblHeader:XNALabel
$CC00=tbName:EditorTextBox
$CC01=lblName:XNALabel
$CC02=tbAuthor:EditorTextBox
$CC03=lblAuthor:XNALabel
$CC04=tbCarryOverCap:EditorNumberTextBox
$CC05=lblCarryOverCap:XNALabel
$CC06=tbPercent:EditorNumberTextBox
$CC07=lblPercent:XNALabel
$CC08=tbInitialTime:EditorNumberTextBox
$CC09=lblInitialTime:XNALabel
$CC10=tbHomeCell:EditorNumberTextBox
$CC11=lblHomeCell:XNALabel
$CC12=selTheme:EditorPopUpSelector
$CC13=lblTheme:XNALabel
$CC14=chkEndOfGame:XNACheckBox
$CC15=chkOneTimeOnly:XNACheckBox
$CC16=chkSkipScore:XNACheckBox
$CC17=chkSkipMapSelect:XNACheckBox
; Second column
$CC18=chkIgnoreGlobalAITriggers:XNACheckBox
$CC19=chkOfficial:XNACheckBox
$CC20=chkTruckCrate:XNACheckBox
$CC21=chkTrainCrate:XNACheckBox
$CC22=chkMultiplayerOnly:XNACheckBox
$CC23=chkGrowingTiberium:XNACheckBox
$CC24=chkGrowingVeins:XNACheckBox
$CC25=chkGrowingIce:XNACheckBox
$CC26=chkTiberiumDeathToVisceroid:XNACheckBox
$CC27=chkFreeRadar:XNACheckBox
$CC28=chkRequiredAddOn:XNACheckBox
$CC29=btnApply:EditorButton
$Height=getBottom(btnApply) + EMPTY_SPACE_BOTTOM
HasCloseButton=true

[lblHeader]
FontIndex=1
Text=基础设置
$X=horizontalCenterOnParent()
$Y=EMPTY_SPACE_TOP

[tbName]
$X=EMPTY_SPACE_SIDES + 150
$Width=150
$Y=getBottom(lblHeader) + EMPTY_SPACE_TOP

[lblName]
$X=EMPTY_SPACE_SIDES
$Y=getY(tbName) + 1
Text=名称:

[tbAuthor]
$X=getX(tbName)
$Width=getWidth(tbName)
$Y=getBottom(tbName) + VERTICAL_SPACING

[lblAuthor]
$X=EMPTY_SPACE_SIDES
$Y=getY(tbAuthor) + 1
Text=作者:

[tbCarryOverCap]
$X=getX(tbName)
$Width=getWidth(tbName)
$Y=getBottom(tbAuthor) + VERTICAL_SPACING

[lblCarryOverCap]
$X=EMPTY_SPACE_SIDES
$Y=getY(tbCarryOverCap) + 1
Text=Carry Over Cap:

[tbPercent]
$X=getX(tbName)
$Width=getWidth(tbName)
$Y=getBottom(tbCarryOverCap) + VERTICAL_SPACING

[lblPercent]
$X=EMPTY_SPACE_SIDES
$Y=getY(tbPercent) + 1
Text=百分比:

[tbInitialTime]
$X=getX(tbName)
$Width=getWidth(tbName)
$Y=getBottom(tbPercent) + VERTICAL_SPACING

[lblInitialTime]
$X=EMPTY_SPACE_SIDES
$Y=getY(tbInitialTime) + 1
Text=初始时间:

[tbHomeCell]
$X=getX(tbName)
$Width=getWidth(tbName)
$Y=getBottom(tbInitialTime) + VERTICAL_SPACING

[lblHomeCell]
$X=EMPTY_SPACE_SIDES
$Y=getY(tbHomeCell) + 1
Text=Home Cell:

[selTheme]
$X=getX(tbName)
$Width=getWidth(tbName)
$Y=getBottom(tbHomeCell) + VERTICAL_SPACING

[lblTheme]
$X=EMPTY_SPACE_SIDES
$Y=getY(selTheme) + 1
Text=主题:

[chkEndOfGame]
$X=EMPTY_SPACE_SIDES
$Y=getBottom(selTheme) + VERTICAL_SPACING
Text=最后一关

[chkOneTimeOnly]
$X=EMPTY_SPACE_SIDES
$Y=getBottom(chkEndOfGame) + VERTICAL_SPACING
Text=仅限一次 (跳过显示制作人名单)

[chkSkipScore]
$X=EMPTY_SPACE_SIDES
$Y=getBottom(chkOneTimeOnly) + VERTICAL_SPACING
Text=跳过分数屏幕

[chkSkipMapSelect]
$X=EMPTY_SPACE_SIDES
$Y=getBottom(chkSkipScore) + VERTICAL_SPACING
Text=跳过地图选择

; *************
; Second column
; *************

[chkIgnoreGlobalAITriggers]
$X=EMPTY_SPACE_SIDES + 300 + EMPTY_SPACE_SIDES
$Y=getBottom(lblHeader) + EMPTY_SPACE_TOP
Text=忽略全局 AI 触发器

[chkOfficial]
$X=getX(chkIgnoreGlobalAITriggers)
$Y=getBottom(chkIgnoreGlobalAITriggers) + VERTICAL_SPACING
Text=官方

[chkTruckCrate]
$X=getX(chkIgnoreGlobalAITriggers)
$Y=getBottom(chkOfficial) + VERTICAL_SPACING
Text=摧毁载具生成工具箱

[chkTrainCrate]
$X=getX(chkIgnoreGlobalAITriggers)
$Y=getBottom(chkTruckCrate) + VERTICAL_SPACING
Text=摧毁火车生成工具箱

[chkMultiplayerOnly]
$X=getX(chkIgnoreGlobalAITriggers)
$Y=getBottom(chkTrainCrate) + VERTICAL_SPACING
Text=仅限多人游戏

[chkGrowingTiberium]
$X=getX(chkIgnoreGlobalAITriggers)
$Y=getBottom(chkMultiplayerOnly) + VERTICAL_SPACING
Text=泰伯利亚矿生长

[chkGrowingVeins]
$X=getX(chkIgnoreGlobalAITriggers)
$Y=getBottom(chkGrowingTiberium) + VERTICAL_SPACING
Text=矿脉生长

[chkGrowingIce]
$X=getX(chkIgnoreGlobalAITriggers)
$Y=getBottom(chkGrowingVeins) + VERTICAL_SPACING
Text=冰蔓延

[chkTiberiumDeathToVisceroid]
$X=getX(chkIgnoreGlobalAITriggers)
$Y=getBottom(chkGrowingIce) + VERTICAL_SPACING
Text=泰伯利亚矿中单位转生为器官兽

[chkFreeRadar]
$X=getX(chkIgnoreGlobalAITriggers)
$Y=getBottom(chkTiberiumDeathToVisceroid) + VERTICAL_SPACING
Text=无需雷达

[chkRequiredAddOn]
$X=getX(chkIgnoreGlobalAITriggers)
$Y=getBottom(chkFreeRadar) + VERTICAL_SPACING
Text=增强模式
$Enabled=1 - IS_RA2YR

; Apply button

[btnApply]
$Width=100
$X=(getWidth(BasicSectionConfigWindow) - getWidth(btnApply)) / 2
$Y=getBottom(chkSkipMapSelect) + EMPTY_SPACE_TOP
Text=应用

