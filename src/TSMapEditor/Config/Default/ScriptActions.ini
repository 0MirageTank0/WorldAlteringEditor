; C&C World-Altering Editor (WAE)
; https://github.com/CnCNet/WorldAlteringEditor

; This file defines the script actions available in the map editor.
; The sections are parsed in their order and the script actions are
; assigned internal indexes based on their order in this file.

; Each script action has a name, a description, a parameter description
; and can optionally have a set of preset values.
; A script action can optionally also specify a type for its parameter
; so the editor can alter its UI (for example, if the script expects a waypoint value).

[AttackQuarry]
Name=攻击猎物
Description=攻击目标类型(猎物),并重复攻击直到该类型的所有目标被摧毁或单位耗尽弹药.目标选择(选择最近的或最先创建的)受 TargetDistanceCoefficientDefault 影响.
ParamDescription=Target
ParamType=Quarry
Option0=0,无
Option1=1,任何目标
Option2=2,建筑物
Option3=3,采矿车
Option4=4,步兵
Option5=5,载具
Option6=6,生产建筑
Option7=7,基地防御建筑
Option8=8,基地威胁(?)
Option9=9,发电厂
Option10=10,可进驻建筑
Option11=11,科技建筑

[AttackWaypoint]
Name=攻击路径点
Description=攻击指定路径点处的对象(如果存在)或单元格.如果存在建筑且队伍成员具有 Infiltrate、Engineer、Agent 或 C4 属性,则动作将相应改变.
ParamDescription=路径点
ParamType=Waypoint

[GoBerzerk]
Name=狂暴(无效)
Description=小队中的生化人(Cyborg)成员将进入狂暴状态.

[MoveToWaypoint]
Name=移动到路径点
Description=命令小队移动到指定的路径点.只有当所有小队成员都到达该路径点附近一个单元格的距离内(对于空中单位则是等效距离)时,该动作才算完成.
ParamDescription=路径点
ParamType=Waypoint

[MoveToCell]
Name=移动到单元格
Description=命令队伍移动到地图上可玩边界内的特定单元格.
ParamDescription=单元格
ParamType=Cell

[GuardArea]
Name=区域警戒
Description=在指定的时间内守卫区域.
ParamDescription=秒
ParamType=Number

[JumpToLine]
Name=脚本跳转到指定行号执行
Description=跳转到脚本中的新行号.用于循环操作.行号从1开始计数.
ParamDescription=目标行
ParamType=Number

[ForcePlayerWin]
Name=强制玩家胜利
Description=为作战小队的所属方强制执行游戏胜利条件.

[Unload]
Name=卸载
Description=卸载所有已装载的单位.命令参数指定哪些单位应继续作为队伍的一部分,哪些单位应与队伍分离.
ParamDescription=卸载后行为
Option0=0,保留运输器,保留单位
Option1=1,保留运输器,除名单位
Option2=2,除名运输器,保留单位
Option3=3,除名运输器,除名单位

[Deploy]
Name=部署
Description=使小队中所有可部署单位部署.

[FollowFriendlies]
Name=跟随友军
Description=小队跟随最近的友军单位.

[DoThis]
Name=进入...状态
Description=团队成员被分配新任务.
ParamDescription=任务
Option0=0,休眠
Option1=1,攻击最近的敌人(x)
Option2=2,移动(x)
Option3=3,跟随
Option4=4,撤退
Option5=5,警戒
Option6=6,固守(不追击)
Option7=7,进入物体(x)
Option8=8,占领物体
Option9=9,变卖(粉碎回收厂)
Option10=10,采矿
Option11=11,区域警戒
Option12=12,返回(精炼厂)
Option13=13,停止
Option14=14,埋伏(被发现前等待)
Option15=15,游猎
Option16=16,卸载
Option17=17, 破坏(进入并毁坏)(x)
Option18=18,建造建筑(x)
Option19=19,变卖建筑(x)
Option20=20,维修
Option21=21,救援
Option22=22,导弹(x)
Option23=23,无害
Option24=24,开门(x)
Option25=25, 巡逻(x)
Option26=26,运输机接近空降区(x)
Option27=27,运输机在空降区空投(x)
Option28=28,待命
Option29=29,再次攻击
Option30=30,侦察机接近
Option31=31,侦察机飞过

[SetGlobalVariable]
Name=设置全局变量
Description=设置一个全局变量.
ParamType=GlobalVariable

[IdleAnim]
Name=空闲动画
Description=使成员进入空闲动画.
ParamDescription=动画
Option0=0,Idle1
Option1=1,Idle2

[LoadOntoTransport]
Name=装载到运输工具上
Description=让所有单位进入运输器(如果运输器存在于此特遣部队中的话)

[SpyOnStructureAtWaypoint]
Name=间谍进入路径点的建筑物(废弃)
Description=指示团队在给定的路径点渗透建筑物.(废弃)
ParamDescription=路径点
ParamType=Waypoint

[PatrolToWaypoint]
Name=巡逻到路径点
Description=移动到给定的路径点,同时扫描视线内的敌人,并与这些敌人交战,即使团队必须离开其巡逻路线.
ParamDescription=路径点
ParamType=Waypoint

[ChangeScript]
Name=更改动作脚本
Description=让小队使用新的脚本(参数为脚本ID)
ParamDescription=新脚本
ParamType=ScriptType

[ChangeTeam]
Name=更改作战小队
Description=让小队更改小队类型(参数为作战小队ID).
ParamDescription=作战小队
ParamType=TeamType

[Panic]
Name=惊慌
Description=让小队所有单位惊慌.

[ChangeHouse]
Name=更改所属方
Description=全部更改所属方(参数为所属方编号)
ParamDescription=所属方
ParamType=HouseType

[Scatter]
Name=分散
Description=让所有单位分散.

[AfraidRunToShroud]
Name=惊恐跑入附近黑幕
Description=让团队表现得很害怕,并跑到最近的黑幕.团队不会主动参与战斗或获取目标,也不会报复(如果受到攻击,它会分散).

[ForcePlayerLoss]
Name=强制玩家失败
Description=强制让作战小队的所属方玩家失败.

[PlaySpeech]
Name=播放语音
Description=播放指定的语音文件.
ParamDescription=语音
ParamType=Speech

[PlaySound]
Name=播放音效
Description=播放指定的音效文件.
ParamDescription=音效
ParamType=Sound

[PlayMovie]
Name=播放影片
Description=播放指定的电影文件.
ParamDescription=电影
ParamType=Movie

[PlayTheme]
Name=播放主题音乐
Description=播放指定的主题音乐.
ParamDescription=主题音乐
ParamType=Theme

[ReduceTiberium]
Name=减少泰伯利亚矿石
Description=减少作战小队所占据的单元内的泰伯利亚矿石的数量.

[BeginProduction]
Name=开始生产
Description=让强制让作战小队的所属方开始生产.

[FireSale]
Name=建筑大甩卖
Description=强制出售作战小队所属方所拥有的所有剩余建筑(在FA2中也称之为变卖一博).

[SelfDestruct]
Name=自我摧毁
Description=令团队自毁,通常伴随着爆炸.

[IonStormStart]
Name=闪电风暴开始
Description=在指定时间后启动闪电风暴
ParamType=Number
ParamDescription=秒(游戏内)

[IonStormEnd]
Name=闪电风暴
Description=使闪电风暴结束.

[CenterViewOnTeam]
Name=镜头聚焦小队
Description=镜头聚焦小队.
ParamType=Number
ParamDescription=速度
Option0=0,最慢
Option1=1,慢
Option2=2,快
Option3=3,更快
Option4=4,最快

[ReshroudMapForTime]
Name=重置黑幕
Description=在给定的时间内,除玩家自己和/或友方单位显示的区域外,整个地图都会被覆盖,之后探索的区域会再次显示.
ParamType=Number
ParamDescription=秒(可能在尤复无效？)

[RevealMapForTime]
Name=显示全部地图
Description=在给定时间内显示整个地图,之后地图再次被笼罩.
ParamType=Number
ParamDescription=秒(可能在尤复无效？)

[DeleteTeamMembers]
Name=删除小队成员
Description=从地图上删除小队成员.

[ClearGlobal]
Name=清除全局变量
Description=清除指定全局变量.
ParamDescription=全局变量
ParamType=GlobalVariable

[SetLocal]
Name=设置局部变量
Description=设置指定局部变量.
ParamDescription=局部变量
ParamType=LocalVariable

[ClearLocal]
Name=清除局部变量
Description=清除指定局部变量.
ParamDescription=局部变量
ParamType=LocalVariable

[Unpanic]
Name=镇定
Description=使所有团队成员停止恐慌.

[ChangeFacing]
Name=改变面朝向
Description=让成员面向新的指定方向.
ParamDescription=方向
ParamType=Number
Option0=0,North (右上)
Option1=1,North-East (右)
Option2=2,East (右下)
Option3=3,South-East (下)
Option4=4,South (左下)
Option5=5,South-West (左)
Option6=6,West (左上)
Option7=7,North-West (上)

[WaitUntilFullyLoaded]
Name=等到满载
Description=指示运输工具等到满载成员后再执行后续脚本动作.一般在'装载成员'动作后使用.

[UnloadTruck]
Name=卸货卡车
Description=将单位从 TRUCKB 转换为 TRUCKA,然后继续执行接下来的脚本动作.给人一种卡车正在卸货的画面感.

[LoadTruck]
Name=装载卡车
Description=将单位从 TRUCKA 转换为 TRUCKB,然后继续执行接下来的脚本动作.给人一种卡车正在装载的画面感.

[AttackEnemyStructure]
Name=攻击敌方特定建筑
Description=攻击由建筑物参数指定的敌方建筑物.
ParamDescription=建筑物
ParamType=BuildingWithProperty

[MoveToEnemyStructure]
Name=移动到敌方特定建筑
Description=移动到指定类型的建筑.
ParamDescription=建筑物
ParamType=BuildingWithProperty

[Scout]
Name=侦查
Description=向随机方向移动.

[RegisterSuccess]
Name=标记AI触发器为成功
Description=当团队通过AI触发器(AITrigger,不是触发器'Trigger')组建时,当其任务组执行此脚本作时,它会被标记为成功.不包含此动作的脚本将失败.(脚本包含此动作,但倘若执行脚本时无法执行此动作,也视为失败).此成功或失败用于调整其 AITrigger 中定义的当前权重(Weight).

[Flash]
Name=闪烁
Description=闪烁小队一段时间.
ParamDescription=持续时间 (帧)
ParamType=Number

[PlayAnimation]
Name=播放动画
Description=播放小队单位附加的指定动画.
ParamDescription=动画
ParamType=Animation

[DisplayTalkBubble]
Name=显示对话气泡
Description=在小队第一个单位上显示对话气泡.
ParamDescription=气泡类型
Option0=0,无
Option1=1,星号 (*)
Option2=2,问号 (?)
Option3=3,感叹号 (!)

; ********** RA2/YR BEGINS + ARES ALTERATIONS ***********
[GatherAtEnemy]
Name=聚集在敌方基地 [Ares 改进]
Description=找到一个距离敌方基地AISafeDistance + 参数 的位置并在此集.Ares使用未使用的 Number 参数.如果不使用ARES,则将参数设置为 0.
ParamType=Number
ParamDescription=距离变量

[GatherAtBase]
Name=聚集在我方基地 [Ares 改进]
Description=找到一个距离己方基地AISafeDistance + 参数 的位置并在此集.Ares使用未使用的 Number 参数.如果不使用ARES,则将参数设置为 0.
ParamType=Number
ParamDescription=距离变量

[IronCurtain]
Name=铁幕 [Ares 改进]
Description=令小队所属方(如果技能尚未就绪,则等待)将指定超级武器组编号的铁幕对小队使用.Ares使用未使用的 Number 参数.如果不使用ARES,则将参数设置为 0.
ParamType=Number; a superweapon selector would be useful.
ParamDescription=超级武器组ID

[ChronoSphereTeamBuildings]
Name=超时空传送到建筑物
Description=如果小队所属方的超时空传送准备就绪,那么将用于把小队移动到给定的建筑物,然后再进行下一步行动.
ParamDescription=建筑物
ParamType=BuildingWithProperty

[ChronoSphereTeamTarget]
Name=超时空传送到目标
Description=如果小队所属方的超时空传送准备就绪,那么将用于把小队移动到给定的目标类型.精确目标是根据 TargetDistanceCoefficientDefault 中使用的值或其 TargetDistanceCoefficient 的技术类型覆盖来构建的最近/最先创建的目标.
ParamDescription=目标
ParamType=Quarry
Option0=0,无
Option1=1,任何目标
Option2=2,建筑物
Option3=3,矿车
Option4=4,步兵
Option5=5,载具
Option6=6,生产建筑
Option7=7,基地防御建筑
Option8=8,基地威胁(?)
Option9=9,发电厂
Option10=10,可驻军建筑
Option11=11,中立科技建筑

[MoveToFriendlyStructure]
Name=移动到我方建筑
Description=移动到自己的建筑物或由参数中给出的盟友拥有的建筑物.
ParamDescription=建筑物
ParamType=BuildingWithProperty

[AttackStructureAtWaypoint]
Name=攻击位于路径点的建筑
Description=攻击给路径点的建筑物.所有者不被视为敌人、盟友或中立者.工程师的攻击将意味着修复建筑物.此动作还使用单位的武器(如果存在)而不是特殊能力(如C4).这在摧毁可进驻建筑而不是进入它等情况下很有用.
ParamType=Waypoint
ParamDescription=路径点

[EnterGrinder]
Name=进入粉碎回收厂
Description=队伍将进入由该队伍或其盟友拥有的最近的粉碎回收厂.

[OccupyTankBunker]
Name=进驻坦克碉堡
Description=此队伍中任何没有设置 Bunkerable=no 的载具成员,将进入最近的、拥有 Bunker=yes 设置且未被占用的建筑,前提是该建筑由队伍的所有者或其任何盟友所拥有.

[EnterBioReactor]
Name=进入生化发电厂
Description=此队伍中的任何步兵成员将进入最近的、拥有 InfantryAbsorb=yes 设置的建筑,前提是该建筑由该队伍的所有者或其任何盟友所拥有,并发电厂有空间.

[OccupyBattleBunker];63
Name=进驻战斗碉堡
Description=此队伍中任何设置了 Occupier=yes 的步兵成员将进入最近的(他们所拥有的)具有 CanOccupyFire=yes 设置的建筑.

[GarrisonStructure]
Name=进驻建筑物
Description=此队伍中任何设置了 Occupier=yes 的步兵成员将进入最近的(中立)具有 CanOccupyFire=yes 设置的建筑.这是专门用于将单位的武器转移到建筑上的.

; ********** ARES ADDITIONS *********** Starts at 65

[AuxPower]
Name=额外电力 [Ares]
Description=永久性地改变拥有该队伍的阵营的电力输出,改变量为指定的数值.
ParamType=Number
ParamDescription=电量

[KillDrivers]
Name=杀死驾驶员 [Ares]
Description=杀死该队伍中所有单位的无保护驾驶员,并将他们分配给名为Special的国家.

[TakeVehicles]
Name=夺取载具 [Ares]
Description=如果可能的话,该队伍中的所有步兵(具有 CanDrive 或 VehicleThief 能力)将被分配到他们可以驾驶或劫持的最近车辆上.

[ConvertType]
Name=变形 [Ares]
Description=将该队伍的所有成员转换为他们各自通过 Convert.Script 定义的类型.

[SonarReveal]
Name=显形 [Ares]
Description=在给定的持续时间(帧数)内,禁止所有队伍成员隐身的能力.
ParamType=Number
ParamDescription=持续时间(帧)

[DisableWeapons]
Name=除你武器！ [Ares]
Description=在给定的持续时间(帧数)内,禁止所有队伍成员开火.使用0来结束此效果.
ParamType=Number
ParamDescription=持续时间(帧)

; ********** ARES ENDS ***********
